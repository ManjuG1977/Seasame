name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - qa
      - uat
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop
      - qa
      - uat
      - main

env:
  AZURE_CONTAINER_REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
  IMAGE_NAME: frontend-app  # or backend-app depending on repo
  DOCKERFILE_PATH: ./Dockerfile
  CONTEXT_PATH: .

jobs:
  # ==============================================
  # JOB 1: SonarCloud Scan (Matrix for multi-service)
  # ==============================================
  sonarcloud-scan:
    name: SonarCloud_Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    
    # If you have both frontend/backend in same repo, use matrix
    strategy:
      matrix:
        service: [frontend]  # Change to [frontend, backend] if both in same repo
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.projectVersion=1.0.${{ github.run_number }}
            -Dsonar.sources=.
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/*.test.js,**/*.spec.js
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

  # ==============================================
  # JOB 2: Generate Version Tag
  # ==============================================
  generate-version:
    name: Semantic_Tag
    runs-on: ubuntu-latest
    needs: sonarcloud-scan
    if: github.event_name == 'push'
    outputs:
      version: ${{ steps.version.outputs.version }}
      environment: ${{ steps.version.outputs.environment }}
      docker_tag: ${{ steps.version.outputs.docker_tag }}
      short_sha: ${{ steps.version.outputs.short_sha }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA
        id: sha
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Determine environment from branch
        id: branch-env
        run: |
          BRANCH="${{ github.ref_name }}"
          case $BRANCH in
            develop)
              echo "environment=dev" >> $GITHUB_OUTPUT
              echo "env_short=dev" >> $GITHUB_OUTPUT
              ;;
            qa)
              echo "environment=qa" >> $GITHUB_OUTPUT
              echo "env_short=qa" >> $GITHUB_OUTPUT
              ;;
            uat)
              echo "environment=uat" >> $GITHUB_OUTPUT
              echo "env_short=uat" >> $GITHUB_OUTPUT
              ;;
            main)
              echo "environment=prod" >> $GITHUB_OUTPUT
              echo "env_short=prod" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Generate semantic version
        id: version
        run: |
          # Get latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "1.0.0")
          echo "Latest tag: $LATEST_TAG"
          
          # Parse version
          # Remove 'v' prefix if present
          CLEAN_TAG=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_TAG"
          
          # Set defaults if parsing failed
          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          
          # Increment based on branch
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            # Production: Major increment
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [[ "${{ github.ref_name }}" == "uat" ]]; then
            # UAT: Minor increment
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [[ "${{ github.ref_name }}" == "qa" ]]; then
            # QA: Patch increment
            PATCH=$((PATCH + 1))
          else
            # Develop: Use run number for patch
            PATCH=${{ github.run_number }}
          fi
          
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          SHORT_SHA="${{ steps.sha.outputs.short_sha }}"
          DOCKER_TAG="${{ steps.branch-env.outputs.env_short }}-v${VERSION}-${SHORT_SHA}"
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "environment=${{ steps.branch-env.outputs.environment }}" >> $GITHUB_OUTPUT
          echo "docker_tag=$DOCKER_TAG" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          
          # Create git tag
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a "v$VERSION-${{ steps.branch-env.outputs.environment }}" -m "Release v$VERSION for ${{ steps.branch-env.outputs.environment }}"
          git push origin "v$VERSION-${{ steps.branch-env.outputs.environment }}"
          
          # Save version info
          cat > version.json << EOF
          {
            "version": "$VERSION",
            "environment": "${{ steps.branch-env.outputs.environment }}",
            "docker_tag": "$DOCKER_TAG",
            "branch": "${{ github.ref_name }}",
            "commit": "${{ github.sha }}",
            "short_sha": "$SHORT_SHA",
            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF

      - name: Upload version info
        uses: actions/upload-artifact@v3
        with:
          name: version-info
          path: version.json

  # ==============================================
  # JOB 3: Build and Push Docker Image
  # ==============================================
  build-docker:
    name: Build_docker
    runs-on: ubuntu-latest
    needs: generate-version
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download version info
        uses: actions/download-artifact@v3
        with:
          name: version-info

      - name: Read version
        id: version
        run: |
          VERSION_JSON=$(cat version.json)
          echo "version=$(echo $VERSION_JSON | jq -r .version)" >> $GITHUB_OUTPUT
          echo "docker_tag=$(echo $VERSION_JSON | jq -r .docker_tag)" >> $GITHUB_OUTPUT
          echo "environment=$(echo $VERSION_JSON | jq -r .environment)" >> $GITHUB_OUTPUT

      - name: Azure Container Registry Login
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ${{ env.CONTEXT_PATH }}
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.docker_tag }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.environment }}-latest
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:v${{ steps.version.outputs.version }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            ENVIRONMENT=${{ steps.version.outputs.environment }}
            BUILD_TIMESTAMP=${{ github.event.head_commit.timestamp }}
          cache-from: type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.docker_tag }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Generate image metadata
        run: |
          cat > image-metadata.json << EOF
          {
            "image": "${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.docker_tag }}",
            "version": "${{ steps.version.outputs.version }}",
            "environment": "${{ steps.version.outputs.environment }}",
            "docker_tag": "${{ steps.version.outputs.docker_tag }}",
            "branch": "${{ github.ref_name }}",
            "commit": "${{ github.sha }}",
            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF

      - name: Upload image metadata
        uses: actions/upload-artifact@v3
        with:
          name: image-metadata
          path: image-metadata.json

  # ==============================================
  # JOB 4: Deploy to Development (develop branch)
  # ==============================================
  deploy-dev:
    name: Deploy_Dev
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/develop'
    environment:
      name: development
      url: https://dev.domain.com
    
    steps:
      - name: Download image metadata
        uses: actions/download-artifact@v3
        with:
          name: image-metadata

      - name: Read image info
        id: image
        run: |
          METADATA=$(cat image-metadata.json)
          echo "image=$(echo $METADATA | jq -r .image)" >> $GITHUB_OUTPUT
          echo "version=$(echo $METADATA | jq -r .version)" >> $GITHUB_OUTPUT
          echo "docker_tag=$(echo $METADATA | jq -r .docker_tag)" >> $GITHUB_OUTPUT

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Dev App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.DEV_APP_NAME }}
          images: ${{ steps.image.outputs.image }}
          slot-name: production

      - name: Configure App Settings
        uses: azure/app-service-settings@v1
        with:
          app-name: ${{ secrets.DEV_APP_NAME }}
          settings: |
            [
              {
                "name": "VERSION",
                "value": "${{ steps.image.outputs.version }}"
              },
              {
                "name": "ENVIRONMENT",
                "value": "development"
              },
              {
                "name": "DOCKER_TAG",
                "value": "${{ steps.image.outputs.docker_tag }}"
              }
            ]

      - name: Verify deployment
        run: |
          sleep 30
          curl -f https://dev.domain.com/health || echo "Health check failed"
          curl -f https://dev.domain.com/version || echo "Version endpoint check failed"

  # ==============================================
  # JOB 5: Deploy to QA (qa branch)
  # ==============================================
  deploy-qa:
    name: Deploy_QA
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/qa'
    environment:
      name: qa
      url: https://qa.domain.com
    
    steps:
      - name: Download image metadata
        uses: actions/download-artifact@v3
        with:
          name: image-metadata

      - name: Read image info
        id: image
        run: |
          METADATA=$(cat image-metadata.json)
          echo "image=$(echo $METADATA | jq -r .image)" >> $GITHUB_OUTPUT
          echo "version=$(echo $METADATA | jq -r .version)" >> $GITHUB_OUTPUT

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to QA App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.QA_APP_NAME }}
          images: ${{ steps.image.outputs.image }}
          slot-name: production

      - name: Configure App Settings
        uses: azure/app-service-settings@v1
        with:
          app-name: ${{ secrets.QA_APP_NAME }}
          settings: |
            [
              {
                "name": "VERSION",
                "value": "${{ steps.image.outputs.version }}"
              },
              {
                "name": "ENVIRONMENT",
                "value": "qa"
              }
            ]

      - name: Run QA smoke tests
        run: |
          echo "Running QA smoke tests..."
          curl -f https://qa.domain.com/api/health
          curl -f https://qa.domain.com/health

  # ==============================================
  # JOB 6: Deploy to UAT (uat branch)
  # ==============================================
  deploy-uat:
    name: Deploy_QAT
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/uat'
    environment:
      name: uat
      url: https://uat.domain.com
    
    steps:
      - name: Download image metadata
        uses: actions/download-artifact@v3
        with:
          name: image-metadata

      - name: Read image info
        id: image
        run: |
          METADATA=$(cat image-metadata.json)
          echo "image=$(echo $METADATA | jq -r .image)" >> $GITHUB_OUTPUT
          echo "version=$(echo $METADATA | jq -r .version)" >> $GITHUB_OUTPUT

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to UAT App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.UAT_APP_NAME }}
          images: ${{ steps.image.outputs.image }}
          slot-name: production

      - name: Configure App Settings
        uses: azure/app-service-settings@v1
        with:
          app-name: ${{ secrets.UAT_APP_NAME }}
          settings: |
            [
              {
                "name": "VERSION",
                "value": "${{ steps.image.outputs.version }}"
              },
              {
                "name": "ENVIRONMENT",
                "value": "uat"
              }
            ]

      - name: Run UAT validation tests
        run: |
          echo "Running UAT validation suite..."
          # Add your UAT test scripts here 

  # ==============================================
  # JOB 8: Send Notification
  # ==============================================
  send-notification:
    name: 📧 Send Notification
    runs-on: ubuntu-latest
    needs: [deploy-dev, deploy-qa, deploy-uat]
    if: always()
    
    steps:
      - name: Download image metadata
        uses: actions/download-artifact@v3
        with:
          name: image-metadata
        continue-on-error: true

      - name: Determine deployment status
        id: status
        run: |
          if [[ "${{ needs.deploy-uat.result }}" == "success" ]]; then
            STATUS="Deployed UAT"
            ENV="uat"
            URL="https://uat.domain.com"
          elif [[ "${{ needs.deploy-qa.result }}" == "success" ]]; then
            STATUS="Deployed QA"
            ENV="qa"
            URL="https://qa.domain.com"
          elif [[ "${{ needs.deploy-dev.result }}" == "success" ]]; then
            STATUS="Deployed Develop"
            ENV="dev"
            URL="https://dev.domain.com"
          else
            STATUS="❌ Failed"
            ENV="unknown"
            URL=""
          fi
          
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Get version from metadata
        id: version
        run: |
          if [ -f "image-metadata.json" ]; then
            VERSION=$(cat image-metadata.json | jq -r .version)
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "version=unknown" >> $GITHUB_OUTPUT
          fi

      - name: Send Teams Notification
        uses: toko-bifrost/ms-teams-deploy-card@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          webhook-uri: ${{ secrets.TEAMS_WEBHOOK_URL }}
          environment: ${{ steps.status.outputs.environment }}
          status: ${{ job.status }}
          description: |
            **${{ steps.status.outputs.status }}** Deployment
            
            **Version:** ${{ steps.version.outputs.version }}
            **Branch:** ${{ github.ref_name }}
            **Environment:** ${{ steps.status.outputs.environment }}
            **URL:** ${{ steps.status.outputs.url }}
            
            **Commit:** ${{ github.sha }}
            **Actor:** ${{ github.actor }}

      - name: Send Email (Optional)
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.status.outputs.status }} - ${{ github.repository }}
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: GitHub Actions
          body: |
            Deployment ${{ steps.status.outputs.status }}
            
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Environment: ${{ steps.status.outputs.environment }}
            Version: ${{ steps.version.outputs.version }}
            Commit: ${{ github.sha }}
            Actor: ${{ github.actor }}
            
            URL: ${{ steps.status.outputs.url }}
